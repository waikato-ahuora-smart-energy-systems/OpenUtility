name: Release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.2"
  UV_VERSION: "0.11.29"

jobs:
  validate:
    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra docs --extra notebook --extra release
      - name: Validate release tag
        if: ${{ github.event_name == 'push' }}
        run: uv run --no-sync python scripts/check_release_tag.py "${GITHUB_REF_NAME}"
      - name: Validate release version
        if: ${{ github.event_name == 'workflow_run' }}
        run: uv run --no-sync python scripts/check_release_version.py
      - name: Run release gate
        run: uv run --no-sync python tools/release_check.py
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openutility-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/OpenUtility/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openutility-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          skip-existing: true
