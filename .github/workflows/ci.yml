name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Install release dependencies
        run: uv sync --extra dev --extra docs --extra notebook --extra release
      - name: Run release readiness gate
        run: uv run --extra dev --extra docs --extra notebook --extra release python tools/release_check.py
