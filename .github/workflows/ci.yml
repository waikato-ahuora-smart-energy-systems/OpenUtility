name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.2"
  UV_VERSION: "0.11.29"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra docs --extra notebook --extra release
      - name: Check locked project version
        run: uv run --no-sync python scripts/check_lockfile_version.py
      - name: Run release gate
        run: uv run --no-sync python tools/release_check.py

  bump-version:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the latest pull-request head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
      - name: Resolve the requested version part
        id: bump-part
        shell: bash
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          BUMP_PART="patch"
          NORMALIZED_LABELS=",${PR_LABELS,,},"
          if [[ "${NORMALIZED_LABELS}" == *",major,"* ]]; then
            BUMP_PART="major"
          elif [[ "${NORMALIZED_LABELS}" == *",minor,"* ]]; then
            BUMP_PART="minor"
          elif [[ "${NORMALIZED_LABELS}" == *",patch,"* ]]; then
            BUMP_PART="patch"
          elif [[ "${PR_TITLE,,}" =~ \[(major|minor|patch)\] ]]; then
            BUMP_PART="${BASH_REMATCH[1]}"
          fi
          echo "part=${BUMP_PART}" >> "${GITHUB_OUTPUT}"
      - name: Advance an equal release version exactly once
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BUMP_PART: ${{ steps.bump-part.outputs.part }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags \
            "https://github.com/${BASE_REPOSITORY}.git" \
            "${BASE_REF}:refs/remotes/pull-base/${BASE_REF}"
          git show \
            "refs/remotes/pull-base/${BASE_REF}:pyproject.toml" \
            > "${RUNNER_TEMP}/base-pyproject.toml"

          BUMP_TOOL=(uvx --from "bump-my-version==1.2.3" bump-my-version)
          CURRENT_VERSION="$(python scripts/check_release_version.py)"
          BASE_VERSION="$(python scripts/check_release_version.py \
            --pyproject "${RUNNER_TEMP}/base-pyproject.toml")"
          CONFIG_VERSION="$("${BUMP_TOOL[@]}" show current_version)"

          if [ "${CONFIG_VERSION}" != "${CURRENT_VERSION}" ]; then
            echo ".bumpversion.toml version '${CONFIG_VERSION}' does not match project version '${CURRENT_VERSION}'." >&2
            exit 1
          fi

          if [ "${CURRENT_VERSION}" = "${BASE_VERSION}" ]; then
            "${BUMP_TOOL[@]}" bump "${BUMP_PART}" --no-tag
            python scripts/check_lockfile_version.py
            python scripts/check_release_version.py \
              --base-pyproject "${RUNNER_TEMP}/base-pyproject.toml"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          elif ! python scripts/check_release_version.py \
            --base-pyproject "${RUNNER_TEMP}/base-pyproject.toml"; then
            echo "Candidate version '${CURRENT_VERSION}' is behind base version '${BASE_VERSION}'; refusing a speculative bump." >&2
            exit 1
          else
            echo "Candidate version '${CURRENT_VERSION}' is already forward; no bump required."
          fi

  release-version:
    needs: bump-version
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        (
          needs.bump-version.result == 'success' ||
          github.event.pull_request.head.repo.full_name != github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the latest pull-request head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
      - run: uv sync --frozen --no-default-groups
      - run: uv run --no-sync python scripts/check_lockfile_version.py
      - name: Require a forward release version
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags \
            "https://github.com/${BASE_REPOSITORY}.git" \
            "${BASE_REF}:refs/remotes/pull-base/${BASE_REF}"
          git show \
            "refs/remotes/pull-base/${BASE_REF}:pyproject.toml" \
            > "${RUNNER_TEMP}/base-pyproject.toml"
          uv run --no-sync python scripts/check_release_version.py \
            --base-pyproject "${RUNNER_TEMP}/base-pyproject.toml"
