name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.2"
  UV_VERSION: "0.11.29"

jobs:
  all-tests:
    needs: bump-version
    runs-on: ubuntu-latest
    if: >-
      ${{ always() &&
          (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') &&
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ needs.bump-version.outputs.head-sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra docs --extra notebook --extra release
      - name: Run all tests with coverage
        run: >-
          uv run --no-sync python -m pytest
          --cov=OpenUtility
          --cov-report=term-missing
          --cov-fail-under=90

  release-gate:
    needs: [all-tests, bump-version]
    runs-on: ubuntu-latest
    if: >-
      ${{ always() && needs.all-tests.result == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ needs.bump-version.outputs.head-sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra docs --extra notebook --extra release
      - name: Check locked project version
        run: uv run --no-sync python scripts/check_lockfile_version.py
      - name: Run release gate
        run: uv run --no-sync python tools/release_check.py
      - name: Execute public notebooks against the built wheel
        shell: bash
        run: |
          set -euo pipefail
          uv venv "${RUNNER_TEMP}/notebook-venv"
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python "${RUNNER_TEMP}/notebook-venv/bin/python" "${wheels[0]}[notebook]"
          "${RUNNER_TEMP}/notebook-venv/bin/python" -I tools/check_notebooks.py \
            --output-dir "${RUNNER_TEMP}/notebook-examples"
      - name: Upload executed notebook examples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openutility-notebook-examples
          path: ${{ runner.temp }}/notebook-examples/*
          if-no-files-found: error

  bump-version:
    outputs:
      head-sha: ${{ steps.bump.outputs.head-sha }}
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the latest pull-request head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
      - name: Apply the requested release version exactly once
        id: bump
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags \
            "https://github.com/${BASE_REPOSITORY}.git" \
            "${BASE_REF}:refs/remotes/pull-base/${BASE_REF}"
          git show \
            "refs/remotes/pull-base/${BASE_REF}:pyproject.toml" \
            > "${RUNNER_TEMP}/base-pyproject.toml"

          BUMP_TOOL=(uvx --from "bump-my-version==1.2.3" bump-my-version)
          CURRENT_VERSION="$(python scripts/check_release_version.py --bump-config .bumpversion.toml)"
          TARGET_VERSION="$(python scripts/check_release_version.py \
            --base-pyproject "${RUNNER_TEMP}/base-pyproject.toml" \
            --plan-bump --labels="${PR_LABELS}" --title="${PR_TITLE}")"

          if [ "${CURRENT_VERSION}" != "${TARGET_VERSION}" ]; then
            "${BUMP_TOOL[@]}" bump --new-version "${TARGET_VERSION}" --no-tag
            python scripts/check_lockfile_version.py
            python scripts/check_release_version.py --bump-config .bumpversion.toml \
              --base-pyproject "${RUNNER_TEMP}/base-pyproject.toml" \
              --require-bump --labels="${PR_LABELS}" --title="${PR_TITLE}"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          else
            echo "Candidate ${CURRENT_VERSION} already satisfies the requested bump."
          fi
          echo "head-sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  release-version:
    needs: bump-version
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        (
          needs.bump-version.result == 'success' ||
          github.event.pull_request.head.repo.full_name != github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the latest pull-request head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.bump-version.outputs.head-sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
      - run: uv sync --frozen --no-default-groups
      - run: uv run --no-sync python scripts/check_lockfile_version.py
      - name: Require the selected release increment
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          git fetch --no-tags \
            "https://x-access-token:${GH_TOKEN}@github.com/${BASE_REPOSITORY}.git" \
            "${BASE_REF}:refs/remotes/pull-base/${BASE_REF}"
          unset GH_TOKEN
          git show \
            "refs/remotes/pull-base/${BASE_REF}:pyproject.toml" \
            > "${RUNNER_TEMP}/base-pyproject.toml"
          uv run --no-sync python scripts/check_release_version.py --bump-config .bumpversion.toml \
            --base-pyproject "${RUNNER_TEMP}/base-pyproject.toml" \
            --require-bump --labels="${PR_LABELS}" --title="${PR_TITLE}"

  pr-gate:
    permissions:
      contents: read
      checks: write
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    needs:
      - all-tests
      - release-gate
      - bump-version
      - release-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable validation job
        env:
          ALL_TESTS_RESULT: ${{ needs.all-tests.result }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BUMP_VERSION_RESULT: ${{ needs.bump-version.result }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RELEASE_GATE_RESULT: ${{ needs.release-gate.result }}
          RELEASE_VERSION_RESULT: ${{ needs.release-version.result }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${ALL_TESTS_RESULT}" = "success"
          test "${RELEASE_GATE_RESULT}" = "success"

          if [ "${BASE_REF}" = "main" ]; then
            if [ "${HEAD_REPO}" = "${REPOSITORY}" ]; then
              test "${BUMP_VERSION_RESULT}" = "success"
            else
              test "${BUMP_VERSION_RESULT}" = "skipped"
            fi
            test "${RELEASE_VERSION_RESULT}" = "success"
          else
            test "${BUMP_VERSION_RESULT}" = "skipped"
            test "${RELEASE_VERSION_RESULT}" = "skipped"
          fi
      - name: Record successful validation on the bot-created commit
        if: >-
          ${{ success() && needs.bump-version.outputs.head-sha != '' &&
              needs.bump-version.outputs.head-sha != github.event.pull_request.head.sha &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ needs.bump-version.outputs.head-sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The test and release jobs checked out this exact SHA after the bump.
          # Publish the same required check without relying on another bot-push run.
          gh api --method POST "repos/${REPOSITORY}/check-runs" \
            -f name=pr-gate -f head_sha="${VALIDATED_SHA}" \
            -f status=completed -f conclusion=success -f details_url="${RUN_URL}" \
            -f 'output[title]=All release checks passed' \
            -f 'output[summary]=Tests, release gate, and version checks passed on this commit.'
